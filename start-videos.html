<style>
:root{
  --paper:#FFFFFF; --card:#F6F7F8; --line:#DFE3E7;
  --orange:#F26A00; --orange-dim:#FFE4CC; --orange-deep:#B34A00;
  --ink:#1E1E1E; --muted:#6B7280;
  --display:'Archivo',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shell-max:1140px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;}

/* ── Top bar ── */
.wt-topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 20px 0;
}
.wt-topbar__inner{
  max-width:var(--shell-max);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.wt-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.wt-logo__img{height:34px;width:auto;display:block;}
.wt-logo__mark{width:34px;height:24px;flex:none;}
.wt-logo__type{display:flex;flex-direction:column;line-height:1;}
.wt-logo__a{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:-.02em;color:var(--ink);}
.wt-logo__b{font-family:var(--display);font-weight:700;font-size:8.5px;letter-spacing:.34em;color:var(--orange-deep);margin-top:2px;}
.wt-count{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;white-space:nowrap;}
.wt-count b{color:var(--ink);font-weight:600;}

.wt-slats{max-width:var(--shell-max);margin:12px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.wt-slat{height:3px;background:var(--line);border-radius:1px;overflow:hidden;}
.wt-slat span{display:block;height:100%;width:0;background:var(--orange);transition:width .45s var(--ease);}
.wt-slat.is-done span{width:100%;}

/* ── Layout ── */
.wt-main{flex:1;width:100%;max-width:var(--shell-max);margin:0 auto;padding:34px 20px 40px;}
.wt-grid{display:grid;grid-template-columns:1fr;gap:34px;align-items:start;}
.wt-grid.is-hero{grid-template-columns:1fr;}
.wt-grid.is-hero .wt-thread{display:none;}

/* ── Cards ── */
.wt-step{animation:wt-in .38s var(--ease) both;}
@keyframes wt-in{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
.wt-eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-deep);margin:0 0 14px;}
.wt-ask{font-family:var(--display);font-weight:800;font-size:clamp(29px,7vw,44px);line-height:1.04;letter-spacing:-.025em;color:var(--ink);margin:0 0 8px;text-wrap:balance;}
.wt-sub{font-size:15px;color:var(--muted);margin:0 0 24px;max-width:46ch;}

.wt-opts{display:flex;flex-direction:column;gap:9px;}
.wt-opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:5px;padding:17px 18px;color:var(--ink);
  font-family:var(--body);font-size:16.5px;font-weight:500;cursor:pointer;
  transition:border-color .16s,background .16s,transform .16s var(--ease);
}
.wt-opt:hover{background:#EDEFF1;border-left-color:var(--orange);transform:translateX(3px);}
.wt-opt:active{transform:translateX(1px) scale(.995);}
.wt-opt__key{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);flex:none;width:16px;}
.wt-opt:hover .wt-opt__key{color:var(--orange-deep);}
.wt-opt.is-selected{
  background:#FFF1E6;border-color:var(--orange);border-left-color:var(--orange);
  font-weight:600;
}
.wt-opt.is-selected .wt-opt__key{color:var(--orange-deep);}
.wt-opt__tick{margin-left:auto;color:var(--orange);font-weight:700;opacity:0;transition:opacity .16s;}
.wt-opt.is-selected .wt-opt__tick{opacity:1;}

/* ── Fields ── */
.wt-fields{display:flex;flex-direction:column;gap:13px;max-width:440px;}
.wt-field label{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.wt-field input{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:15px;color:var(--ink);font-family:var(--body);font-size:16.5px;transition:border-color .16s;
}
.wt-field input::placeholder{color:#9AA1A9;}
.wt-field input:focus{border-color:var(--orange);outline:none;}
.wt-field.has-error input{border-color:#E2564A;}
.wt-err{display:none;color:#E2564A;font-size:12.5px;margin-top:5px;font-family:var(--mono);}
.wt-field.has-error .wt-err{display:block;}

.wt-go{
  margin-top:22px;width:100%;max-width:440px;
  background:var(--orange);color:#140F0A;border:none;border-radius:5px;padding:18px 22px;
  font-family:var(--display);font-weight:800;font-size:17px;line-height:1.25;
  letter-spacing:-.01em;cursor:pointer;
  transition:background .16s,transform .16s var(--ease);
}
.wt-go:hover{background:#FF7A0F;transform:translateY(-2px);}
.wt-go:active{transform:translateY(0);}
.wt-go[disabled]{opacity:.55;cursor:wait;transform:none;}
.wt-fine{font-size:12.5px;color:#8A9099;margin:13px 0 0;max-width:440px;line-height:1.55;}
.wt-back{background:none;border:none;padding:8px 0;margin-top:24px;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.05em;cursor:pointer;}
.wt-back:hover{color:var(--orange-deep);}

/* ── Thread ── */
.wt-thread{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;min-height:150px;}
.wt-thread__hd{display:flex;align-items:center;gap:8px;padding-bottom:11px;margin-bottom:3px;border-bottom:1px solid var(--line);}
.wt-thread__dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none;}
.wt-thread__hd span{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
.wt-thread__idle{font-size:13.5px;color:#8A9099;line-height:1.55;margin:auto 0;}

.wt-bub{max-width:87%;padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;animation:wt-pop .3s var(--ease) both;}
@keyframes wt-pop{from{opacity:0;transform:translateY(9px) scale(.97);}to{opacity:1;transform:none;}}
.wt-bub--in{align-self:flex-start;background:#E9EBED;color:var(--ink);border-bottom-left-radius:4px;}
.wt-bub--out{align-self:flex-end;background:var(--orange);color:#140F0A;border-bottom-right-radius:4px;font-weight:500;}
.wt-bub--sys{align-self:center;background:none;padding:2px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8A9099;max-width:100%;text-align:center;}
.wt-bub b{font-weight:600;}
.wt-tag{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#8A9099;margin-top:-4px;}
.wt-tag--r{align-self:flex-end;}
.wt-tag--l{align-self:flex-start;}
.wt-typing{align-self:flex-end;display:flex;gap:4px;background:var(--orange-dim);padding:13px 15px;border-radius:14px;border-bottom-right-radius:4px;}
.wt-typing i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:wt-blink 1.3s infinite;}
.wt-typing i:nth-child(2){animation-delay:.18s;}
.wt-typing i:nth-child(3){animation-delay:.36s;}
@keyframes wt-blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

/* ── Demo ── */
.wt-demo{animation:wt-in .45s var(--ease) both;}
.wt-demo__hd{font-family:var(--display);font-weight:800;font-size:clamp(27px,6.4vw,40px);line-height:1.06;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance;}
.wt-demo__sub{font-size:16px;color:var(--muted);margin:0 0 26px;max-width:56ch;}
.wt-video{position:relative;width:100%;aspect-ratio:16/9;background:#F0F1F2;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.wt-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.wt-video__slot{text-align:center;padding:26px;font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:#9AA1A9;line-height:2;}
.wt-rest{margin-top:34px;}
.wt-rest__hd{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.015em;color:var(--ink);margin:0 0 5px;}
.wt-rest__sub{font-size:14px;color:var(--muted);margin:0 0 14px;}
.wt-rest__grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.wt-sys{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:none;padding:14px 15px;
  font-family:var(--body);font-size:14.5px;color:var(--ink);cursor:pointer;
  transition:background .14s;
}
.wt-sys:hover{background:#EDEFF1;}
.wt-sys__n{font-family:var(--mono);font-size:11px;font-weight:600;color:#9AA1A9;flex:none;width:20px;}
.wt-sys__nm{flex:1;}
.wt-sys__flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep);flex:none;}
.wt-sys.is-active{background:#FFF1E6;}
.wt-sys.is-active .wt-sys__n{color:var(--orange-deep);}
.wt-sys.is-active .wt-sys__nm{font-weight:600;color:var(--orange-deep);}

/* Booking block */
.wt-book{margin-top:38px;padding-top:32px;border-top:1px solid var(--line);}
.wt-book__hd{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance;}
.wt-book__sub{font-size:15px;color:var(--muted);margin:0 0 22px;max-width:52ch;}
.wt-cal{
  width:100%;min-height:640px;background:#F7F7F5;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.wt-cal iframe{width:100%;height:640px;border:0;display:block;}
.wt-next{display:grid;grid-template-columns:1fr;gap:11px;margin-top:22px;}
.wt-next a{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:5px;padding:17px 18px;text-decoration:none;color:var(--ink);font-weight:500;transition:background .16s,transform .16s var(--ease);}
.wt-next a:hover{background:#EDEFF1;transform:translateX(3px);}
.wt-next span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.09em;}

/* ── Anchor ── */
.wt-anchor{border-top:1px solid var(--line);background:#FAFAFB;padding:15px 20px;}
.wt-anchor__inner{max-width:var(--shell-max);margin:0 auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);}
.wt-anchor b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--orange-deep);letter-spacing:-.01em;}


/* ── Hero ── */
.wt-hero{animation:wt-in .45s var(--ease) both;text-align:center;max-width:640px;margin:0 auto;}
.wt-hero__hd{
  font-family:var(--display);font-weight:900;
  font-size:clamp(32px,8.5vw,52px);line-height:1.02;letter-spacing:-.03em;
  color:var(--ink);margin:0 0 16px;text-wrap:balance;
}
.wt-hero__hd span{color:var(--orange-deep);}
.wt-hero__sub{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 18px;}
.wt-hero__price{
  font-family:var(--body);font-size:15px;color:var(--ink);margin:0 0 26px;
}
.wt-hero__price b{
  font-family:var(--display);font-weight:900;font-size:26px;
  letter-spacing:-.02em;color:var(--ink);
}
.wt-hero__step{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  color:var(--muted);margin:18px 0 0;
}
.wt-hero__step b{color:var(--orange-deep);font-weight:600;}
.wt-go--hero{margin:14px auto 0;display:block;}
.wt-hero__note{font-size:13px;color:var(--muted);margin:14px 0 0;}

@media (min-width:920px){
  .wt-grid{grid-template-columns:1fr 372px;gap:56px;}
  .wt-thread{position:sticky;top:118px;min-height:300px;}
  .wt-main{padding:52px 20px 60px;}
  .wt-next{grid-template-columns:1fr 1fr;}
  .wt-rest__grid{grid-template-columns:1fr 1fr;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════

   ══════════════════════════════════════════════════ */

  },
  'Customers who don\u2019t come back':{
    sys:'08',name:'Repeat Customer Engine',
    open:[['sys','Last job \u00b7 6 months ago'],['sys','Cycle due']],
    text:function(){return 'Hey \u2014 it\u2019s <b>'+first()+'</b>. Been about six months since we '+did()+'. Want me to get you back on the schedule?';},
    tag:'Sent on their cycle \u00b7 automatic',
    close:'Yes please \u2014 same as last time.'
  },
  'Not enough reviews':{
    sys:'06',name:'Google Review Engine',
    open:[['sys','Job marked done \u00b7 3:40 PM'],['sys','Waiting 3 hours']],
    text:function(){return 'Thanks again \u2014 appreciate you having us out. If you\u2019ve got 30 seconds, a Google review helps me more than anything. \u2014 <b>'+first()+'</b>';},
    tag:'Sent 3 hours after the job \u00b7 automatic',
    close:'Just left you 5 stars.'
  },
  'Too much time on paperwork':{
    sys:'07',name:'Customer Inbox & Job Board',
    open:[['sys','New lead \u00b7 web form'],['sys','Logged \u00b7 no typing']],
    text:function(){return 'Hey \u2014 got your request. This is <b>'+first()+'</b>, I can get you a number today. '+ask();},
    tag:'Quoted and booked without you',
    close:'Thursday works. See you then.'
  }
};

var STEPS=[
  {key:'trade',eyebrow:'01 \u2014 The truck',
   ask:'What kind of work do you do?',
   sub:'So everything we show you is built for your trade.',
   opts:TRADES},
  {key:'problem',eyebrow:'02 \u2014 The real one',
   ask:'What\u2019s costing you the most right now?',
   sub:'Pick the one that actually keeps you up. We\u2019ll show you that system running.',
   opts:['Missed calls going to voicemail','Estimates I never hear back on','Chasing people for money','Customers who don\u2019t come back','Not enough reviews','Too much time on paperwork']},
  {key:'website',eyebrow:'03 \u2014 The storefront',
   ask:'Do you have a website?',
   sub:'Straight answer \u2014 it changes what we build you.',
   opts:['No','Facebook page only','Yes, but it\u2019s outdated','Yes, and it\u2019s fine'],
   final:true, cta:'Continue'}
];

function paint(){
  var onHero = state.step===0;
  slats.style.visibility  = onHero ? 'hidden' : 'visible';
  countEl.style.visibility = onHero ? 'hidden' : 'visible';
  if(onHero) return;

  var done=Math.min(state.step-1,TOTAL),bars=slats.children;
  for(var i=0;i<bars.length;i++) bars[i].classList.toggle('is-done',i<done);
  slats.setAttribute('aria-valuenow',done);
  countEl.innerHTML='<b>0'+Math.min(state.step,TOTAL)+'</b> / 04';
}

/* ── Thread ── */
function bubble(kind,html,delay){
  setTimeout(function(){
    if(idle&&idle.parentNode) idle.remove();
    var el=document.createElement('div');
    el.className='wt-bub wt-bub--'+kind; el.innerHTML=html; thread.appendChild(el);
  },delay||0);
}
function tagline(text,side,delay){
  setTimeout(function(){
    var el=document.createElement('div');
    el.className='wt-tag wt-tag--'+side; el.textContent=text; thread.appendChild(el);
  },delay||0);
}
function typing(ms){
  if(idle&&idle.parentNode) idle.remove();
  var el=document.createElement('div');
  el.className='wt-typing'; el.innerHTML='<i></i><i></i><i></i>'; thread.appendChild(el);
  setTimeout(function(){if(el.parentNode) el.remove();},ms);
}
function P(){return PROBLEMS[state.problem];}

function threadFor(key){
  var p=P();
  if(key==='trade'){
    bubble('sys','Your line \u00b7 '+esc(state.trade),0);
  }
  if(key==='problem'&&p){
    threadName.textContent='System '+p.sys+' \u00b7 '+p.name;
    p.open.forEach(function(o,i){bubble(o[0],o[1],i*200);});
    typing(1500);
    bubble('out',p.text(),1550);
    tagline(p.tag,'r',1750);
  }
  if(key==='website'&&p){
    typing(900);
    var line=(state.website==='No'||state.website==='Facebook page only')
      ? 'Photos of past work are on my site \u2014 <b>we build that part free</b>.'
      : 'Photos of past jobs are on my site if you want a look.';
    bubble('out',line,950);
    bubble('in',p.close,1900);
    tagline('Customer replied \u00b7 2 min later','l',2100);
  }
}

/* ── Render ── */
function render(){
  paint();
  document.querySelector('.wt-grid').classList.toggle('is-hero', state.step===0);
  if(state.step===0) return renderHero();
  if(state.step>=1 && state.step<=3) return renderQuestion(STEPS[state.step-1]);
  if(state.step===4) return renderContact();
  return renderDemo();
}

function renderHero(){
  var player = HERO_VIDEO
    ? '<div class="wt-video"><iframe src="'+HERO_VIDEO+'" title="WorkTruck Systems overview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'
      +'<p class="wt-hero__step">2-minute overview</p>'
    : '';

  stage.innerHTML='<div class="wt-hero">'
    +'<h1 class="wt-hero__hd">You run the truck.<br><span>It runs the office.</span></h1>'
    +'<p class="wt-hero__sub">Systems that answer your missed calls, chase your estimates, collect your invoices, and bring old customers back \u2014 while you\u2019re on the job.</p>'
    +'<p class="wt-hero__price"><b>$297</b>/mo \u00b7 website built free \u00b7 no contract</p>'
    +player
    +'<button class="wt-go wt-go--hero" id="heroGo">See it on your trade \u2192</button>'
    +'<p class="wt-hero__note">Three taps. Then it runs for your trade.</p>'
    +'</div>';

  document.getElementById('heroGo').addEventListener('click',function(){
    state.step=1; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
}

function renderContact(){
  stage.innerHTML='<div class="wt-step">'
    +'<p class="wt-eyebrow">04 \u2014 Your demo</p>'
    +'<h1 class="wt-ask">You\u2019re in.</h1>'
    +'<p class="wt-sub">Demo plays on this page. Name and email so we can set it up for your trade.</p>'
    +'<div class="wt-fields">'
    + field('name','First name','Mike')
    + field('cell','Mobile (optional)','(813) 555-0142','tel')
    + field('email','Email','mike@alvarezwash.com','email')
    +'</div>'
    +'<button class="wt-go" id="go">Show my demo \u2192</button>'
    +'<p class="wt-fine">Mobile is optional. Nobody emails you until you book a call.</p>'
    +'</div>';
  ['name','cell','email'].forEach(function(k){
    var el=document.getElementById('f_'+k);
    if(state[k]) el.value=state[k];                 /* restore on Back */
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter') startFunnel();
    });
  });
  document.getElementById('go').addEventListener('click',startFunnel);
}

function renderQuestion(s){
  var h='<div class="wt-step">'
    +'<p class="wt-eyebrow">'+s.eyebrow+'</p>'
    +'<h1 class="wt-ask">'+s.ask+'</h1>'
    +'<p class="wt-sub">'+s.sub+'</p><div class="wt-opts">';
  s.opts.forEach(function(o,i){
    var sel = s.final && state[s.key]===o;
    h+='<button class="wt-opt'+(sel?' is-selected':'')+'" data-val="'+esc(o)+'">'
      +'<span class="wt-opt__key">'+(i+1)+'</span>'+esc(o)
      +(s.final?'<span class="wt-opt__tick">\u2713</span>':'')
      +'</button>';
  });
  h+='</div>';
  if(s.final) h+='<button class="wt-go" id="submit"'+(state[s.key]?'':' disabled')+'>'+s.cta+'</button>';
  h+='<button class="wt-back" id="back">\u2190 Back</button></div>';
  stage.innerHTML=h;

  Array.prototype.forEach.call(stage.querySelectorAll('.wt-opt'),function(btn){
    btn.addEventListener('click',function(){
      state[s.key]=btn.getAttribute('data-val');

      if(s.final){
        /* select only — the submit button advances */
        Array.prototype.forEach.call(stage.querySelectorAll('.wt-opt'),function(b){
          b.classList.toggle('is-selected', b===btn);
        });
        var go=document.getElementById('submit');
        go.disabled=false;
        return;
      }

      threadFor(s.key);
      state.step++;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  if(s.final){
    document.getElementById('submit').addEventListener('click',function(){
      if(!state[s.key]) return;
      var go=document.getElementById('submit');
      go.disabled=true; go.textContent='One sec\u2026';
      threadFor(s.key);
      state.step=4;
      setTimeout(function(){
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      },600);
    });
  }

  document.getElementById('back').addEventListener('click',function(){state.step--;render();});
}

function field(id,label,ph,type){
  return '<div class="wt-field" id="w_'+id+'">'
    +'<label for="f_'+id+'">'+label+'</label>'
    +'<input id="f_'+id+'" type="'+(type||'text')+'" placeholder="'+ph+'" autocomplete="'+auto(id)+'">'
    +'<p class="wt-err">Required</p></div>';
}
function auto(id){return {name:'given-name',cell:'tel',email:'email'}[id]||'off';}

/* ── Webhook ── */
function utms(){
  var q=new URLSearchParams(location.search);
  return {
    utm_source:q.get('utm_source')||'', utm_medium:q.get('utm_medium')||'',
    utm_campaign:q.get('utm_campaign')||'', utm_content:q.get('utm_content')||'',
    utm_term:q.get('utm_term')||'', fbclid:q.get('fbclid')||''
  };
}
function post(payload){
  if(!WEBHOOK_URL || WEBHOOK_URL.indexOf('PASTE_')===0){
    console.warn('WEBHOOK_URL not set — not sent.',payload); return Promise.resolve();
  }
  return fetch(WEBHOOK_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},   /* same origin — no preflight concern */
    body:JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(j){
      if(!j.ok) console.warn('Lead not saved:',j);
      return j;
    }).catch(function(){ return null; });
  }).catch(function(e){ console.warn('Lead post failed:',e); });
}

/* POST #1 — the moment we have contact info. They're a lead even if they bail. */
function startFunnel(){
  var ok=true;
  ['name','cell','email'].forEach(function(k){
    var input=document.getElementById('f_'+k), wrap=document.getElementById('w_'+k);
    var v=input.value.trim();
    var bad=(k==='cell')
      ? (!!v && v.replace(/\D/g,'').length<10)
      : (!v || (k==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)));
    wrap.classList.toggle('has-error',bad);
    if(bad){ok=false;}else{state[k]=v;}
  });
  if(!ok){stage.querySelector('.has-error input').focus();return;}

  var btn=document.getElementById('go');
  btn.disabled=true; btn.textContent='One sec\u2026';

  var p=utms();
  p.firstName=state.name.split(' ')[0];
  p.lastName=state.name.split(' ').slice(1).join(' ');
  p.name=state.name; p.phone=state.cell; p.email=state.email;
  p.demo_status='Not Sent';
  p.funnel_stage='started';
  p.source='Facebook Ads \u2014 /start.html';

  if(window.fbq) fbq('track','Lead');

  post(p).then(function(){
    finishFunnel();
    state.step=5; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
}

/* POST #2 — same contact, now with answers. GHL matches on email/phone and updates. */
function finishFunnel(){
  var p=utms(), pr=P();
  p.firstName=state.name.split(' ')[0];
  p.lastName=state.name.split(' ').slice(1).join(' ');
  p.name=state.name; p.phone=state.cell; p.email=state.email;
  p.trade=state.trade;
  p.biggest_problem=state.problem;
  p.lead_system=pr?('System '+pr.sys+' \u2014 '+pr.name):'';
  p.website_status=state.website;
  p.demo_status='Sent';
  p.funnel_stage='complete';
  p.source='Facebook Ads \u2014 /start.html';
  post(p);
  if(window.fbq) fbq('track','CompleteRegistration',{content_name:state.problem});
}

/* ── Which systems they actually opened, in order ── */
var watched=[], watchTimer=null;

function logWatch(id){
  var sys=null; SYSTEMS.forEach(function(s){ if(s[0]===id) sys=s; });
  var label=id+' '+(sys?sys[1]:'');
  if(watched[watched.length-1]===label) return;   /* ignore re-tapping the same one */
  watched.push(label);
  clearTimeout(watchTimer);
  watchTimer=setTimeout(pushWatched,4000);        /* batch a browsing burst into one post */
}
function watchPayload(){
  var p=utms();
  p.firstName=state.name.split(' ')[0];
  p.lastName=state.name.split(' ').slice(1).join(' ');
  p.name=state.name; p.phone=state.cell; p.email=state.email;
  p.systems_viewed=watched.join('  \u2192  ');
  p.systems_viewed_count=String(watched.length);
  p.funnel_stage='complete';
  return p;
}
function pushWatched(){ if(watched.length) post(watchPayload()); }

/* Safety net — fires if they close the tab mid-browse */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='hidden'||!watched.length) return;
  if(!WEBHOOK_URL || WEBHOOK_URL.indexOf('PASTE_')===0) return;
  try{
    navigator.sendBeacon(WEBHOOK_URL,
      new Blob([JSON.stringify(watchPayload())],{type:"application/json"}));
  }catch(e){}
});

function renderDemo(){
  if(window.fbq) fbq('track','ViewContent',{content_name:'demo_video'});
  var p=P();
  var startId=p?p.sys:'01';
  logWatch(startId);
  paintDemo(startId);
  bubble('sys','\u2014 built from your answers \u2014',300);
}

function paintDemo(id){
  var p=P();
  var sys=null;
  SYSTEMS.forEach(function(s){ if(s[0]===id) sys=s; });
  if(!sys) sys=SYSTEMS[0];

  var url=VIDEOS[id]||'';
  var player = url
    ? '<iframe src="'+url+'" title="'+esc(sys[1])+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>'
    : '<div class="wt-video__slot">The texts this system sends are in the thread. The clip for this one isn\u2019t up yet.</div>';

  var tiles='';
  SYSTEMS.forEach(function(s){
    var mine = p && s[0]===p.sys;
    tiles+='<button class="wt-sys'+(s[0]===id?' is-active':'')+'" data-id="'+s[0]+'">'
      +'<span class="wt-sys__n">'+s[0]+'</span>'
      +'<span class="wt-sys__nm">'+esc(s[1])+'</span>'
      +(mine?'<span class="wt-sys__flag">yours</span>':'')
      +'</button>';
  });

  var lede = (p && id===p.sys)
    ? first()+', start with the one costing you money.'
    : esc(sys[1])+'.';

  stage.innerHTML='<div class="wt-demo">'
    +'<p class="wt-eyebrow">System '+id+' \u00b7 '+esc(sys[1])+' \u00b7 30 seconds</p>'
    +'<h1 class="wt-demo__hd">'+lede+'</h1>'
    +'<p class="wt-demo__sub">Thirty seconds each, running on a real account. Tap any of them below to watch that one.</p>'
    +'<div class="wt-video">'+player+'</div>'
    +'<div class="wt-rest">'
    +'<p class="wt-rest__hd">Check out another system</p>'
    +'<p class="wt-rest__sub">Tap any one to watch it \u2014 30 seconds each. All of them are included at $297/mo.</p>'
    +'<div class="wt-rest__grid" id="tiles">'+tiles+'</div></div>'
    +'<div class="wt-book">'
    +'<h2 class="wt-book__hd">Start now \u2014 $297/mo</h2>'
    +'<p class="wt-book__sub">Website built free. No setup fee. Cancel any month. Opens a 20-minute setup \u2014 not a sales deck.</p>'
    +'<a class="wt-go" href="'+CALENDAR_URL+'" target="_blank" rel="noopener">Book a 20-minute demo \u2192</a>'
    +'</div></div>';

  Array.prototype.forEach.call(document.querySelectorAll('#tiles .wt-sys'),function(b){
    b.addEventListener('click',function(){
      var nid=b.getAttribute('data-id');
      if(window.fbq) fbq('trackCustom','SystemVideoView',{system:nid});
      logWatch(nid);
      paintDemo(nid);
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}
/* deep link: ?demo=1 jumps straight to the demo */
     var dq=new URLSearchParams(location.search);
     if(dq.get('demo')==='1'){ ['name','trade','problem','website'].forEach(function(k){ if(dq.get(k)) state[k]=dq.get(k); }); state.step=5; }
     
render();
</script>
